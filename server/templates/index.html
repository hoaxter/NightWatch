<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NightWatch EDR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>NightWatch</h1>
            </div>
            <nav>
                <a href="#" class="nav-item active" data-tab="dashboard">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="#" class="nav-item" data-tab="alerts">
                    <span class="icon">🚨</span> Alerts
                </a>
                <a href="#" class="nav-item" data-tab="agents">
                    <span class="icon">💻</span> Agents
                </a>
                <a href="#" class="nav-item" data-tab="rules">
                    <span class="icon">🛡️</span> Rules
                </a>
            </nav>
            <div class="user-profile">
                <div class="avatar">A</div>
                <div class="info">
                    <span class="name">Admin</span>
                    <span class="role">Security Ops</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h2 id="page-title">Dashboard</h2>
                <div class="status-indicator">
                    <span class="dot pulse"></span> System Operational
                </div>
            </header>

            <!-- Dashboard View -->
            <div id="view-dashboard" class="view active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Agents</h3>
                        <div class="value" id="stat-total-agents">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Online</h3>
                        <div class="value success" id="stat-online-agents">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Active Alerts</h3>
                        <div class="value warning" id="stat-active-alerts">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Critical</h3>
                        <div class="value danger" id="stat-critical-alerts">0</div>
                    </div>
                </div>

                <div class="section-header">
                    <h3>Recent Alerts</h3>
                </div>
                <div class="alerts-list" id="dashboard-alerts">
                    <!-- Alerts injected here -->
                </div>
            </div>

            <!-- Alerts View -->
            <div id="view-alerts" class="view">
                <div class="alerts-list full-page" id="all-alerts">
                    <!-- All alerts -->
                </div>
            </div>
            
            <!-- Agents View -->
             <div id="view-agents" class="view">
                <div class="agents-grid" id="all-agents">
                    <!-- Agents injected here -->
                </div>
            </div>

        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
